name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcmocka-dev

      - name: Build libraries
        run: |
          ./utils/make_libs.sh

      - name: Build and run release UTs
        run: |
          ./utils/make_UTs_release.sh

      - name: Build and run ITs
        run: |
          ./utils/make_ITs.sh
