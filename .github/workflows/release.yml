name: Release

# Quality gate first, then the shared release pipeline from cicd (tag check, build,
# .deb, bundle, attestation, GitHub Release). A workflow_dispatch run skips the tag
# check and publishes nothing: it only uploads the release-assets bundle.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  quality-gate:
    name: Quality gate
    uses: ./.github/workflows/quality.yml

  release:
    name: Release
    needs: quality-gate
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: RomanHorshkov/cicd/.github/workflows/c-release.yml@v1
    with:
      lib-name: spscring
      title: SPSCring
    secrets:
      SIBLING_REPOS_PAT: ${{ secrets.SIBLING_REPOS_PAT }}
