name: Release

# Quality gate first, then the shared release from cicd (c-release.yml, kind lib). A tag publishes nothing: the release
# is built in kyr-build's pinned build root and published by the train before it pushes the tag. On a tag the one job,
# verify, waits for that release (up to about 30 minutes), then proves VERSION is the tag and every asset of the release
# is in its SHA256SUMS at its hash; a release still missing fails the run ("a train must publish before it tags").
# A workflow_dispatch run builds twice on two runners and compares every hash, publishing nothing (the bundle is only
# uploaded as an artifact); kyr-build's build_deb refuses a release outside its build root, so on a runner that build
# fails until it enters the root.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality gate
    uses: ./.github/workflows/quality.yml
    secrets: inherit

  release:
    name: Release
    needs: quality-gate
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: RomanHorshkov/cicd/.github/workflows/c-release.yml@v2.3.3
    with:
      kind: lib
      lib-name: spscring
      title: SPSCring
    secrets:
      SIBLING_REPOS_PAT: ${{ secrets.SIBLING_REPOS_PAT }}
