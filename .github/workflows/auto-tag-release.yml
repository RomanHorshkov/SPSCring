name: Auto-tag release

# Every push to master is a release: read VERSION, tag it v<VERSION> if that tag doesn't already
# exist, and push the tag. The tag push is what triggers release.yml's build+package+publish —
# this workflow does nothing else. Skips cleanly (not a failure) when VERSION hasn't changed since
# the last release, so a master push that's just docs/CI-only doesn't spam a re-release.
#
# Uses SIBLING_REPOS_PAT (not the default GITHUB_TOKEN) to push the tag: GitHub Actions
# deliberately does not let a workflow run triggered by the default GITHUB_TOKEN cascade into
# ANOTHER workflow run (anti-recursion safeguard) — a tag pushed with GITHUB_TOKEN would silently
# never fire release.yml's `on: push: tags:` trigger. A PAT's push is a normal actor push and
# cascades normally, same reason this project already uses SIBLING_REPOS_PAT for cross-repo
# checkouts elsewhere.

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  tag:
    name: Tag VERSION if new
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.SIBLING_REPOS_PAT }}
          persist-credentials: true

      - name: Tag if VERSION is new
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VER}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} already exists on origin — VERSION unchanged since the last release, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Pushed ${TAG} — release.yml's tag-push trigger takes it from here."
