name: Quality

# Connected graph, not five independent workflows racing each other on every push:
#
#   build
#     +-- compiler-portability -----------------------------+
#     +-- unit-tests-coverage                (leaf)          +--> package-smoke
#     +-- integration-stress -> sanitizers + thread-sanitizer
#
# Also invocable as a reusable workflow (workflow_call) so release.yml can require it to pass
# before cutting a release, instead of re-implementing the same gate.

on:
  push:
    # Tag pushes are release cuts: release.yml's quality-gate job already invokes THIS
    # file via workflow_call for that exact ref. Without this exclusion a tag push fires
    # Quality twice — once directly, once nested inside Release — and while they no
    # longer deadlock (see the concurrency group below), the direct one is pure waste:
    # it just gets cancelled by the nested one (or vice versa) every single release.
    tags-ignore:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # NOT `github.workflow` here: inside a workflow_call invocation (release.yml's
  # quality-gate job calls this file), `github.workflow` resolves to the CALLER's
  # name ("Release"), not this file's own name. Release also groups on
  # `${{ github.workflow }}-${{ github.ref }}`, so both end up computing the
  # IDENTICAL group ("Release-refs/tags/vX.Y.Z") for the same tag push — the
  # parent run occupies that group waiting on quality-gate, and quality-gate can
  # never start because its own parent already holds the group it needs. GitHub
  # detects and cancels this as a deadlock (confirmed live in uuid7, fixed there
  # in commit 43ff27d). A hardcoded literal prefix keeps this file's group
  # stable and distinct regardless of who calls it.
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (all profiles)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Build libraries
        run: ./utils/build_libs.sh

  compiler-portability:
    name: Strict compile (${{ matrix.compiler }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang
      - name: Compile public library with strict diagnostics
        run: |
          ${{ matrix.compiler }} -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
              -DSPSC_REQUIRE_ALWAYS_LOCK_FREE -Iapp -c app/spscring.c \
              -o /tmp/spscring-${{ matrix.compiler }}.o

  unit-tests-coverage:
    name: "Release UTs + 100% UT/IT coverage gate"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcmocka-dev gcovr
      - name: Build and run release UTs
        run: ./utils/build_UTs_release.sh
      - name: Build and run UTs+ITs with combined coverage
        run: ./utils/build_UTs.sh
      - name: Upload coverage artifacts (HTML/XML/JSON)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uts-coverage
          path: tests/results/UTs

  integration-stress:
    name: Threaded integration + stress tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcmocka-dev
      - name: Build and run ITs
        run: ./utils/build_ITs.sh
      - name: Build the producer/consumer stress test
        run: ./utils/build_stress.sh
      - name: Run the producer/consumer stress test
        run: ./utils/run_stress.sh
      - name: Upload stress results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stress-results
          if-no-files-found: warn
          path: tests/results/stress

  sanitizers:
    name: ASan, UBSan, LSan (UTs + ITs + stress)
    needs: integration-stress
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcmocka-dev
      - name: Build and run sanitized UTs, ITs, and stress
        run: ./utils/build_sanitizer_tests.sh

  thread-sanitizer:
    name: ThreadSanitizer (ITs + stress)
    needs: integration-stress
    # build_tsan_tests.sh runs the binaries under `setarch -R` (ASLR off), so the runner's
    # kernel no longer decides whether TSan can map its shadow memory.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcmocka-dev
      - name: Build and run TSan ITs and stress
        run: ./utils/build_tsan_tests.sh

  package-smoke:
    name: Package build + install + smoke test
    needs: [compiler-portability, unit-tests-coverage, sanitizers, thread-sanitizer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config fakeroot
      - name: Build .deb
        run: ./utils/build_deb.sh
      - name: Install the built .deb
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          ARCH="$(dpkg --print-architecture)"
          DEB_FILE="build/debs/spscring_${VERSION}_${ARCH}.deb"
          if [[ ! -f "${DEB_FILE}" ]]; then
            echo "expected package not found: ${DEB_FILE}" >&2
            exit 1
          fi
          sudo apt-get install -y "./${DEB_FILE}"
      - name: Smoke test the installed package
        run: ./utils/smoke_test_package.sh
      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-package
          path: |
            build/debs/*.deb
            build/debs/SHA256SUMS
          if-no-files-found: error
