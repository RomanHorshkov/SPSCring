name: Quality

# Connected graph, not six independent workflows racing each other on every push:
#
#   build
#     +-- unit-tests-coverage                       (leaf: release UTs + 100% UT coverage gate)
#     +-- integration-tests -> sanitizers -> package-smoke
#
# Also invocable as a reusable workflow (workflow_call) so release.yml can require it to pass
# before cutting a release, instead of re-implementing the same gate.

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # NOT `github.workflow` here: inside a workflow_call invocation (release.yml's
  # quality-gate job calls this file), `github.workflow` resolves to the CALLER's
  # name ("Release"), not this file's own name. Release also groups on
  # `${{ github.workflow }}-${{ github.ref }}`, so both end up computing the
  # IDENTICAL group ("Release-refs/tags/vX.Y.Z") for the same tag push — the
  # parent run occupies that group waiting on quality-gate, and quality-gate can
  # never start because its own parent already holds the group it needs. GitHub
  # detects and cancels this as a deadlock (confirmed live in uuid7, fixed there
  # in commit 43ff27d). A hardcoded literal prefix keeps this file's group
  # stable and distinct regardless of who calls it.
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (all profiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Build libraries
        run: ./utils/build_libs.sh

  unit-tests-coverage:
    name: "Release UTs + 100% UT coverage gate"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcmocka-dev gcovr
      - name: Build and run release UTs
        run: ./utils/make_UTs_release.sh
      - name: Build and run UTs with coverage
        run: ./utils/make_UTs_cov.sh
      - name: Upload coverage artifacts (HTML/XML/JSON)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uts-coverage
          path: tests/results/UTs

  integration-tests:
    name: Threaded integration tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcmocka-dev
      - name: Build and run ITs
        run: ./utils/make_ITs.sh

  sanitizers:
    name: ASan, UBSan, LSan (UTs + ITs)
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcmocka-dev
      - name: Build and run sanitized UTs and ITs
        run: ./utils/make_sanitizer_tests.sh

  package-smoke:
    name: Package build + install + smoke test
    needs: sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config fakeroot
      - name: Build .deb
        run: ./utils/build_deb.sh
      - name: Install the built .deb
        run: |
          DEB_FILE="$(find build/debs -maxdepth 1 -name '*.deb' -print -quit)"
          if [[ -z "${DEB_FILE}" ]]; then
            echo "no .deb found under build/debs/" >&2
            exit 1
          fi
          # apt-get only treats an argument as a local file path if it starts with ./ or /;
          # a bare relative path like "build/debs/foo.deb" (even though it contains slashes)
          # is parsed as a REPOSITORY PACKAGE NAME instead and fails with a confusing
          # "Unable to locate package build/debs" error.
          sudo apt-get install -y "./${DEB_FILE}"
      - name: Smoke test the installed package
        run: ./utils/smoke_test_package.sh
      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-package
          path: |
            build/debs/*.deb
            build/debs/SHA256SUMS
          if-no-files-found: error
