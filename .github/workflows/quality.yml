name: Quality

# The shared gate from cicd (c-quality.yml, kind lib). Also callable (workflow_call) so release.yml can require it.
# A release tag does not run it directly: a tag's Quality run is the one nested in Release, as its gate. The
# concurrency group is keyed on the calling workflow's name (Release when nested), so that gate and a direct run
# never cancel each other.

on:
  # One run per commit: master only (the owner, 2026-11-11; `together` carries the same commits). A release tag's run is
  # release.yml's quality gate, which calls this workflow.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: RomanHorshkov/cicd/.github/workflows/c-quality.yml@v2.3.3
    with:
      kind: lib
      lib-name: spscring
      strict-cflags: "-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DSPSC_REQUIRE_ALWAYS_LOCK_FREE"
    secrets:
      SIBLING_REPOS_PAT: ${{ secrets.SIBLING_REPOS_PAT }}
