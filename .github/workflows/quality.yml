name: Quality

# The shared gate from cicd (c-quality.yml, kind lib). Also callable (workflow_call) so release.yml can require it.
# A tag push runs it twice on purpose: once directly, once nested in Release; the concurrency group is keyed on the
# calling workflow's name so neither cancels the other.

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: RomanHorshkov/cicd/.github/workflows/c-quality.yml@v2
    with:
      kind: lib
      lib-name: spscring
      strict-cflags: "-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DSPSC_REQUIRE_ALWAYS_LOCK_FREE"
    secrets:
      SIBLING_REPOS_PAT: ${{ secrets.SIBLING_REPOS_PAT }}
