name: unit-tests

on:
  push:
    branches:
      - master
      - rearchitecturing
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uts:
    name: UTs + coverage (manual scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcmocka-dev gcovr jq

      - name: Run unit tests and generate coverage
        run: |
          ./utils/make_UTs.sh

      - name: Upload coverage artifacts (HTML/XML/JSON)
        uses: actions/upload-artifact@v4
        with:
          name: uts-coverage
          path: |
            tests/results/UTs
